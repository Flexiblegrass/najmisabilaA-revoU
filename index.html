<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Tracker</title>

  <!-- TC-1: Single CSS file -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============================================================
       HEADER
       - App title / logo area
       - Optional: month/year navigator
  ============================================================ -->
  <header id="app-header">
    <h1><!-- App Title --></h1>
    <!-- TODO: Add subtitle or month navigator here -->
  </header>

  <!-- ============================================================
       MAIN WRAPPER
       All content sections live inside here
  ============================================================ -->
  <main id="app-main">

    <!-- ----------------------------------------------------------
         SECTION 1: BUDGET SUMMARY CARDS
         - Total Budget
         - Total Expenses
         - Remaining Balance
    ---------------------------------------------------------- -->
    <section id="summary-section">
      <div class="card" id="card-budget">
        <span class="card-label"><!-- e.g. "Total Budget" --></span>
        <span class="card-value" id="total-budget"><!-- dynamic --></span>
      </div>

      <div class="card" id="card-expenses">
        <span class="card-label"><!-- e.g. "Total Expenses" --></span>
        <span class="card-value" id="total-expenses"><!-- dynamic --></span>
      </div>

      <div class="card" id="card-balance">
        <span class="card-label"><!-- e.g. "Remaining" --></span>
        <span class="card-value" id="remaining-balance"><!-- dynamic --></span>
      </div>
    </section>

    <!-- ----------------------------------------------------------
         SECTION 2: VISUALIZATION / CHART AREA
         - Budget vs Expense bar, pie chart, progress ring, etc.
         - Use <canvas> or pure CSS bars — your choice
    ---------------------------------------------------------- -->
    <section id="chart-section">
      <h2><!-- Section title e.g. "Spending Overview" --></h2>

      <!-- Option A: HTML5 Canvas -->
      <canvas id="budget-chart" width="300" height="300"></canvas>

      <!-- Option B: CSS-only progress bar (uncomment to use instead)
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="expense-bar"></div>
      </div>
      -->
    </section>

    <!-- ----------------------------------------------------------
         SECTION 3: ADD EXPENSE FORM
         - Category selector
         - Amount input
         - Description / note
         - Submit button
    ---------------------------------------------------------- -->
    <section id="form-section">
      <h2><!-- e.g. "Add Expense" --></h2>

      <form id="expense-form" novalidate>

        <!-- Category -->
        <div class="form-group">
          <label for="expense-category"><!-- e.g. "Category" --></label>
          <select id="expense-category" name="category">
            <option value="">-- Select --</option>
            <!-- TODO: Add category options -->
          </select>
        </div>

        <!-- Amount -->
        <div class="form-group">
          <label for="expense-amount"><!-- e.g. "Amount" --></label>
          <input
            type="number"
            id="expense-amount"
            name="amount"
            min="0"
            placeholder="0"
          />
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="expense-desc"><!-- e.g. "Description" --></label>
          <input
            type="text"
            id="expense-desc"
            name="description"
            placeholder=""
          />
        </div>

        <!-- Date -->
        <div class="form-group">
          <label for="expense-date"><!-- e.g. "Date" --></label>
          <input type="date" id="expense-date" name="date" />
        </div>

        <!-- Submit -->
        <button type="submit" id="btn-add-expense">
          <!-- e.g. "Add Expense" -->
        </button>

      </form>
    </section>

    <!-- ----------------------------------------------------------
         SECTION 4: SET BUDGET FORM
         - Input to set/update monthly budget
    ---------------------------------------------------------- -->
    <section id="budget-section">
      <h2><!-- e.g. "Set Budget" --></h2>

      <form id="budget-form" novalidate>
        <div class="form-group">
          <label for="budget-amount"><!-- e.g. "Monthly Budget" --></label>
          <input
            type="number"
            id="budget-amount"
            name="budget"
            min="0"
            placeholder="0"
          />
        </div>

        <button type="submit" id="btn-set-budget">
          <!-- e.g. "Save Budget" -->
        </button>
      </form>
    </section>

    <!-- ----------------------------------------------------------
         SECTION 5: EXPENSE LIST / HISTORY
         - List of recorded expenses
         - Each item: category, description, amount, date, delete btn
    ---------------------------------------------------------- -->
    <section id="list-section">
      <h2><!-- e.g. "Expense History" --></h2>

      <!-- Filter / sort controls (optional) -->
      <div id="list-controls">
        <!-- TODO: Add filter by category or date here -->
      </div>

      <!-- Expense items rendered here by JS -->
      <ul id="expense-list">
        <!-- Items injected dynamically -->
      </ul>

      <!-- Empty state message -->
      <p id="empty-state" class="hidden">
        <!-- e.g. "No expenses yet. Start by adding one!" -->
      </p>
    </section>

  </main>

  <!-- ============================================================
       FOOTER
       - Optional: version, credits, or clear-data button
  ============================================================ -->
  <footer id="app-footer">
    <!-- TODO: Add footer content -->
  </footer>

  <!-- TC-1: Single JS file (loaded at bottom so DOM is ready) -->
  <script src="js/app.js"></script>

</body>
</html>
